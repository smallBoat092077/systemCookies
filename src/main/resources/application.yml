server:
  port: 8088
  servlet:
    context-path: /

spring:
  application:
    name: system-cookies
  profiles:
    active: dev
  # ===== 数据源：虚拟机 192.168.156.132 上的 MySQL 容器 =====
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.156.132:3306/system_cookies?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: '123'
  # ===== 缓存：虚拟机 192.168.156.132 上的 Redis 容器 =====
  data:
    redis:
      host: 192.168.156.132
      port: 6379
      password: '123456'
      database: 0
      timeout: 5s
      connect-timeout: 3s
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3s
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# ===== MyBatis Plus =====
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.example.systemcookies.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      insert-strategy: not_null
      update-strategy: not_null

logging:
  level:
    root: info
    com.example.systemcookies: debug

# ===== 业务自定义配置 =====
recipe:
  cache:
    enabled: true
    ttl-minutes: 30

# ===== 打卡图片上传目录（相对路径，不存在时自动创建） =====
app:
  upload-dir: ./uploads/
  # ===== 点菜小助理（阿里云百炼 / 通义千问）=====
  # 未配置 api-key 时自动降级为本地规则引擎，仍能走完推荐→加购→下单
  ai:
    # 建议用环境变量注入，不要把密钥写进仓库：DASHSCOPE_API_KEY=sk-xxx
    api-key: ${DASHSCOPE_API_KEY:sk-145b4244c70f4bb59d6aa618750cf205}
    model: ${AI_MODEL:qwen-plus}
    base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    # 开启模型联网搜索：true 时模型可按需检索外部信息作答（需模型与账号支持 enable_search）
    enable-search: ${AI_ENABLE_SEARCH:true}
